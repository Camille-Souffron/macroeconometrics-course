project:
  type: book
  output-dir: _book

book:
  title: "Macroeconometrics"
  subtitle: "Lecture Notes - M2 EPOG JM"
  author: "Camille Souffron"
  date: last-modified
  search: true
  repo-url: https://github.com/Camille-Souffron/macroeconometrics-course
  repo-actions: [edit, issue]
  page-footer:
    left: "Camille Souffron, Ecole Normale Supérieure & Paris School of Economics"
    right: "Built with Quarto"
  navbar:
    background: light
  sidebar:
    style: docked
    collapse-level: 1

  # All 7 supplied lectures converted (source/slides/01_TS, 03_ARMA, 04_VAR,
  # 05_Structural_VAR_Identification, 06_Nonlinear_specifications,
  # 07_Cointegration_DFM, 09_BAYES). Lectures 2, 8, and 10 from the original
  # course roadmap (index.qmd) were not supplied and are not yet converted.
  chapters:
    - index.qmd

    - part: "Mathematical Preliminaries"
      chapters:
        - chapters/00-mathematical-foundations.qmd

    - part: "Foundations"
      chapters:
        - chapters/01-time-series.qmd

    - part: "Univariate Linear Models"
      chapters:
        - chapters/02-arma.qmd

    - part: "Frequency-Domain Methods"
      chapters:
        - chapters/08-frequency-filtering.qmd

    - part: "Vector Autoregressions"
      chapters:
        - chapters/03-var.qmd
        - chapters/04-svar-identification.qmd

    - part: "Cointegration and Multivariate Extensions"
      chapters:
        - chapters/05-cointegration-dfm.qmd

    - part: "Nonlinear and Time-Varying Models"
      chapters:
        - chapters/06-nonlinear.qmd

    - part: "Distributional Forecasting and Tail Risk"
      chapters:
        - chapters/09-growth-at-risk.qmd

    - part: "Machine Learning and Forecasting"
      chapters:
        - chapters/10-machine-learning-time-series.qmd

    - part: "Bayesian Methods"
      chapters:
        - chapters/07-bvar.qmd

    - references.qmd

bibliography: references.bib

format:
  html:
    theme:
      - cosmo
      - styles/custom.scss
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 2
    code-fold: true
    code-tools: true
    fig-cap-location: bottom
    tbl-cap-location: top
    link-external-icon: true
    link-external-newwindow: true
    mainfont: "Georgia, 'Times New Roman', serif"

execute:
  freeze: auto
  echo: true
  warning: false
